[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "btcvm"
version = "0.1.0"
description = "A minimal register machine that executes in lockstep with Bitcoin blocks"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["bitcoin", "register-machine", "vm", "blockchain", "vdf", "cryptography"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security :: Cryptography",
  "Topic :: System :: Emulators",
]

# No runtime dependencies — uses stdlib only (urllib, hashlib, json, etc.)
dependencies = []

[project.scripts]
btcvm = "main:main"
ott = "ott:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
]
s3 = [
  "boto3>=1.34",
]
gcs = [
  "google-cloud-storage>=2.10",
]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.setuptools]
py-modules = ["main", "vm", "clock", "trace", "fleet", "vdf", "verify", "broadcast", "asm", "programs", "imgfs", "ott"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
  "E501",  # line too long — tighten later
  "E741",  # ambiguous variable names (l, O, I) — used in register notation
]
